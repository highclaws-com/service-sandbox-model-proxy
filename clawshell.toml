version = "0.2.1"
log_level = "info"

[server]
host = "0.0.0.0"
port = 18790

[upstream]
openai_base_url = "https://api.openai.com"
anthropic_base_url = "https://api.anthropic.com"
openrouter_base_url = "https://openrouter.ai/api"
opencode_zen_base_url = "https://opencode.ai/zen"
minimax_base_url = "https://api.minimax.io"
mimo_tokenplan_base_url = "https://token-plan-sgp.xiaomimimo.com"

[[keys]]
virtual_key = "vk-openai-codex"
auth = "oauth"
oauth_provider = "codex"
provider = "openai"

[[oauth_providers]]
provider = "codex"

[[keys]]
virtual_key = "vk-openrouter"
real_key = "unset"
provider = "openrouter:openrouter_base_url"

[[keys]]
virtual_key = "vk-opencode-zen"
real_key = "unset"
provider = "opencode:opencode_zen_base_url"

[[keys]]
virtual_key = "vk-mimo-tokenplan"
real_key = "unset"
provider = "openai:mimo_tokenplan_base_url"

[dlp]
scan_responses = false

[stats]
persist_path = "/var/log/clawshell/stats.json"
